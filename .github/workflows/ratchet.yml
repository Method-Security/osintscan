name: 🔩 Ratchet Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ratchet:
    name: Ratchet Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: 'sethvargo/ratchet@8b4ca256dbed184350608a3023620f267f0a5253' # ratchet:exclude tag:v0.11.4
        with:
          files: '.github/workflows/*.yml'
