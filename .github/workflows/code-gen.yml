name: 🔄 Generate Fern Code

on:
  workflow_call:

permissions:
  contents: read

jobs:
  generate_fern_go:
    name: Generate Fern Code (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # ratchet:actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Generate Fern Go Code
        run: fern generate --group local
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Upload Fern Generated Code
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: fern-generated-code
          path: generated/
          retention-days: 3
