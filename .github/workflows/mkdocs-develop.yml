name: 📖 Deploy Dev Docs

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
    branches:
      - develop

jobs:
  build-documents:
    name: Test Documentation Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # mkdocs gh-deploy requires write permissions to create a new branch
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # ratchet:actions/setup-python@v6
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r docs/build/requirements.txt

      - name: Test Build
        run: mkdocs build --verbose --strict

      - name: Deploy Docs
        run: mkdocs gh-deploy --force
