name: 📖 Deploy Dev Docs

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
    branches:
      - develop

jobs:
  build-documents:
    name: Test Documentation Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # mkdocs gh-deploy requires write permissions to create a new branch
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # ratchet:actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r docs/build/requirements.txt

      - name: Test Build
        run: mkdocs build --verbose --strict

      - name: Deploy Docs
        run: mkdocs gh-deploy --force
