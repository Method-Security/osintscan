name: 🙏🏻 Verify

on:
  pull_request:
    paths:
      - "**.*"
  push:
    branches:
      - develop

env:
  GO_VERSION: "1.24.0"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Dependences
        run: sudo apt install libpcap-dev

      - name: Godel Verify
        run: ./godelw verify
