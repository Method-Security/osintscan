version: 2

project_name: osintscan

builds:
  - id: prebuilt
    builder: prebuilt
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64
    prebuilt:
      path: output/build-{{ .Os }}_{{ .Arch }}/osintscan{{ if eq .Os "windows" }}.exe{{ end }}
    binary: osintscan

archives:
  - id: archive
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- else}}{{- .Os }}{{ end }}-
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else if eq .Arch "arm" }}ARM
      {{- else if eq .Arch "arm64" }}ARM64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

dockers_v2:
  - ids:
      - prebuilt
    images:
      - "ghcr.io/method-security/osintscan"
      - "docker.io/methodsecurity/osintscan"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "An on-rails OSINT enumeration tool"
      "org.opencontainers.image.vendor": "Method Security"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.source": "https://github.com/method-security/osintscan"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.url": "https://method.security"
      "org.opencontainers.image.documentation": "https://github.com/method-security/osintscan"
    sbom: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"
