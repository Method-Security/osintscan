imports:
  dns: ../../common/dns.yml
types:
  DiscoverDnsRecordsConfig:
    properties:
      domain: string
      recordTypes: list<string>
      sleep: optional<integer>
      jitter: optional<integer>
  DiscoverDnsRecordsResult:
    properties:
      dnsRecords: optional<list<dns.DnsRecord>>
      dmarcRecords: optional<list<dns.DnsRecord>>
      dkimRecords: optional<list<dns.DnsRecord>>
  DiscoverDnsRecordsReport:
    properties:
      config: DiscoverDnsRecordsConfig
      result: DiscoverDnsRecordsResult
      errors: optional<list<string>>
