imports:
  dns: ../../common/dns.yml

types:
  DiscoverDnsRecordsConfig:
    properties:
      domain: string

  DiscoverDnsRecordsResult:
    properties:
      dnsRecords: list<dns.DnsRecord>
      dmarcRecords: list<dns.DnsRecord>
      dkimRecords: list<dns.DnsRecord>

  DiscoverDnsRecordsReport:
    properties:
      config: DiscoverDnsRecordsConfig
      result: DiscoverDnsRecordsResult
      errors: optional<list<string>>
