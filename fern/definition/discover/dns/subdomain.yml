types:
# Enums
  DiscoverDnsSubdomainType:
    enum:
      - ACTIVE
      - CORRELATION
      - PASSIVE
  WordlistSize:
    enum:
      - TINY
      - SMALL
      - MEDIUM
      - LARGE
# Configs
  DiscoverDnsSubdomainActiveConfig:
    properties:
      domain: string
      subdomains: optional<list<string>>
      wordlistSize: optional<WordlistSize>
      wordlistFile: optional<string>
      threads: integer
      maxDepth: integer
      timeout: integer
      dnsResolvers: optional<list<string>>
  DiscoverDnsSubdomainCorrelationConfig:
    properties:
      domains: list<string>
      threads: integer
      timeout: integer
      dnsResolvers: optional<list<string>>
  DiscoverDnsSubdomainPassiveConfig:
    properties:
      domain: string
      requestsPerSecond: integer
      threads: integer
# Reports
  DiscoverDnsSubdomainConfig:
    discriminant: discoveryType
    union:
      active: DiscoverDnsSubdomainActiveConfig
      correlation: DiscoverDnsSubdomainCorrelationConfig
      passive: DiscoverDnsSubdomainPassiveConfig
  DiscoverDnsSubdomainResult:
    properties:
      subdomains: optional<list<string>>
  DiscoverDnsSubdomainReport:
    properties:
      config: DiscoverDnsSubdomainConfig
      result: DiscoverDnsSubdomainResult
      errors: optional<list<string>>
