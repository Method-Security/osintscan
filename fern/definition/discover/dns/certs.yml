types:
  CertificateRecord:
    properties:
      issuerCAID: integer
      issuerName: string
      commonName: string
      nameValue: string
      id: integer
      entryTimestamp: string
      notBefore: string
      notAfter: string
      serialNumber: string
      resultCount: integer
  DiscoverDnsCertsConfig:
    properties:
      domain: string
  DiscoverDnsCertsResult:
    properties:
      certificates: optional<list<CertificateRecord>>
  DiscoverDnsCertsReport:
    properties:
      config: DiscoverDnsCertsConfig
      result: DiscoverDnsCertsResult
      errors: optional<list<string>>
