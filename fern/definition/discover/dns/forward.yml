types:
# Config Struct
  DiscoverDnsForwardConfig:
    properties:
      domain: string
      dnsResolvers: optional<list<string>>
      sleep: optional<integer>
      jitter: optional<integer>
# Result Structs
  LookupDetails:
    properties:
      domain: string
      ipAddress: optional<string>
  DiscoverDnsForwardResult:
    properties:
      lookups: optional<list<LookupDetails>>
# Report Struct
  DiscoverDnsForwardReport:
    properties:
      config: DiscoverDnsForwardConfig
      result: DiscoverDnsForwardResult
      errors: optional<list<string>>
