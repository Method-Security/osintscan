types:
# CdnProvider Enum
  CdnProvider:
    enum: 
    - AKAMAI
    - CLOUDFLARE
    - CLOUDFRONT
    - INCAPSULA
    - VERCEL
# CDN File Structs
  CdnProviderEntry:
    properties:
      ipv4Ranges: list<string>
      ipv6Ranges: list<string>
  CdnProviders:
    properties:
      cdnProviders: map<string, CdnProviderEntry>
# Report Config
  DiscoverCdnConfig:
    properties:
      domain: string
      ipAddresses: optional<list<string>>
      dnsResolvers: optional<list<string>>
      fingerprintsFile: string
# Report Structs
  CdnMatch:
    properties:
      provider: CdnProvider
      matchedRange: string
  IpCdnResult:
    properties:
      domain: string
      ipAddress: string
      match: CdnMatch
  DiscoverCdnResult:
    properties:
      matches: optional<list<IpCdnResult>>
  DiscoverCdnReport:
    properties:
      config: DiscoverCdnConfig
      result: DiscoverCdnResult
      errors: optional<list<string>>