types:
# CdnProvider Enum
  CdnProvider:
    enum:
    - AKAMAI
    - AWS
    - AZURE_FRONTDOOR
    - CLOUDFLARE
    - CLOUDFRONT
    - EDGECAST
    - FASTLY
    - GOCACHE
    - GOOGLE
    - INCAPSULA
    - ORACLE
    - OTHER
    - VERCEL
# Report Config
  DiscoverCdnConfig:
    properties:
      domain: string
      ipAddresses: optional<list<string>>
      dnsResolvers: optional<list<string>>
      fingerprintsFile: optional<string>
# Report Structs
  IpCdnResult:
    properties:
      domain: string
      ipAddress: string
      provider: CdnProvider
  DiscoverCdnResult:
    properties:
      matches: optional<list<IpCdnResult>>
  DiscoverCdnReport:
    properties:
      config: DiscoverCdnConfig
      result: DiscoverCdnResult
      errors: optional<list<string>>