types:
  # Struct for a fingerprint to be used for a domain takeover check
  DnsTakeoverFingerprint:
    properties:
      cicdPass: boolean
      cname: optional<list<string>>
      discussion: string
      documentation: string
      fingerprint: string
      httpStatus: optional<integer>
      nxDomain: boolean
      service: string
  # Config for a domain takeover check
  DnsTakeoverConfig:
    properties:
      fingerprints: list<DnsTakeoverFingerprint>
      successfulOnly: boolean
      onlyHTTPS: boolean
      TLSVerify: boolean
      timeout: integer
  # Report
  HostingService:
    properties:
      name: string
      vulnerable: boolean
  DnsTakeoverResponse:
    properties:
      statusCode: optional<integer>
      responseHeaders: optional<map<string, string>>
      responseBody: optional<string>
      error: optional<string>
  DomainTakeover:
    properties:
      target: string
      domain: string
      cname: string
      returnsNXDomain: boolean
      response: optional<DnsTakeoverResponse>
      hostingServices: list<HostingService>
  DomainTakeoverReport:
    properties:
      targets: optional<list<DomainTakeover>>
      config: DnsTakeoverConfig
      errors: optional<list<string>>
