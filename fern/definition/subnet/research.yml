types:
  SubnetReport:
    properties:
      subnet: string
      total_ips: integer
      scanned_at: datetime
      reports: list<IPReport>
      metrics: RunMetrics
      cancelled: optional<boolean>
  IPReport:
    properties:
      ip: string
      ptr_records: list<string>
      asn: optional<ASNInfo>
      ownership: optional<WhoisData>
      hostnames: optional<list<string>>
      tls_cert_cn: optional<string>
      tls_san: optional<list<string>>
      http_title: optional<string>
      abuse_email: optional<string>
      netblock_range: optional<string>
      first_seen: optional<datetime>
      service_banner: optional<string>
      lookup_time_ms: optional<integer>
      errors: list<string>

  ASNInfo:
    properties:
      number:          integer                 
      org:             optional<string>       
      country:         optional<string>       
      name:            optional<string>         
      prefix:          optional<string>        
      registry:        optional<string>        
      source:          string                 

  WhoisData:
    properties:
      registrar: optional<string>
      created_date: optional<datetime>
      updated_date: optional<datetime>
      org_name: optional<string>
      contact_name: optional<string>
      contact_email: optional<string>
      address: optional<string>
      phone: optional<string>
      country: optional<string>
      raw: optional<string>
    
  RunMetrics:
    properties:
      started_at:     optional<datetime>
      finished_at:    optional<datetime>
      runtime_ms:     optional<integer>       # finished - started
      ip_total:       optional<integer>
      ip_success:     optional<integer>
      ip_failed:      optional<integer>
      avg_ip_ms:      optional<integer>
      cache:          optional<CacheStats>
      ptr:            optional<OpStats>
      asn:            optional<OpStats>
      rdap:           optional<OpStats>

  CacheStats:
    properties:
      rdap_hits:      optional<integer>
      rdap_misses:    optional<integer>
      rdap_evictions: optional<integer>

  OpStats:           # one instance for PTR, ASN, RDAP
    properties:
      calls:         optional<integer>
      succeeded:     optional<integer>
      failed:        optional<integer>
      timeouts:      optional<integer>