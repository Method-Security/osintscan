types:
  DnsRecordEnum:
    enum:
      - A
      - AAAA
      - CNAME
      - MX
      - NS
      - SOA
      - TXT
  DnsQueryHeader:
    properties:
      ID: integer
      Flags: integer
      QDCount: integer
      ANCount: integer
      NSCount: integer
      ARCount: integer
  DnsZoneTransferRecord:
    properties:
      Name: string
      Type: DnsRecordEnum
      Ttl: optional<integer>
      Class: optional<integer>
      Value: string
  DnsZoneTransferDetails:
    properties:
      Domain: string
      DNSRecords: optional<list<DnsZoneTransferRecord>>
      Success: optional<boolean>
  DnsZoneTransferReport:
    properties:
      Domains: list<string>
      ZoneTransfer: optional<list<DnsZoneTransferDetails>>
      Errors: optional<list<string>>
