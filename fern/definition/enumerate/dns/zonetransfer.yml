imports:
  dns: ../../common/dns.yml
types:
# Config Struct
  EnumerateDnsZoneTransferConfig:
    properties:
      zones: list<string>
      dnsResolvers: optional<list<string>>
      targetNameservers: optional<list<string>>
      timeout: integer
# Report Structs
  DnsZoneTransferApplication:
    properties:
      nameserver: string
      dnsServer: string
      dnsRecords: list<dns.DnsRecord>
  DnsZoneTransferDetails:
    properties:
      zone: string
      applications: list<DnsZoneTransferApplication>
  EnumerateDnsZoneTransferResult:
    properties:
      zoneTransfers: optional<list<DnsZoneTransferDetails>>
  EnumerateDnsZoneTransferReport:
    properties:
      config: EnumerateDnsZoneTransferConfig
      result: EnumerateDnsZoneTransferResult
      errors: optional<list<string>>
