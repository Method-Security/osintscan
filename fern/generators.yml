default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.34.5
        config:
          importPath: github.com/Method-Security/osintscan/generated/go
        output:
          location: local-file-system
          path: ../generated/go
        smart-casing: false
  pypi-local:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.2
        config:
          extra_fields: forbid
        output:
          location: local-file-system
          path: ../generated/python
        smart-casing: false
  pypi-test:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.2
        config:
          package_name: methodosintscan
          extra_fields: forbid
        output:
          location: pypi
          package-name: methodosintscan
          token: ${TEST_PYPI_TOKEN}
          url: https://test.pypi.org/legacy/
        smart-casing: false
  pypi:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.2
        config:
          package_name: methodosintscan
          extra_fields: forbid
        output:
          location: pypi
          package-name: methodosintscan
          token: ${PYPI_TOKEN}
        smart-casing: false
